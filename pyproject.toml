[project]
name = "rubygemdb"
version = "0.1.0"
description = "Ruby gem analysis and classification tool"
readme = "README.md"
authors = [
    { name = "Robert Pannick", email = "rwpannick@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "rich>=14.3.3",
    "textual==8.2.3",
]

[project.scripts]
rubygemdb = "rubygemdb.cli:run_cli"
rubygemdb-tui = "rubygemdb.ui.tui:run_tui"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rubygemdb"]
